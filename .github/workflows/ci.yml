name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Native macOS compile
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile native application and icon
        run: |
          xcrun swiftc -warnings-as-errors -target "$(uname -m)-apple-macosx14.0" -framework AppKit -framework WebKit desktop/macos/LearningTree.swift -o "$RUNNER_TEMP/LearningTree"
          xcrun swiftc -warnings-as-errors -target "$(uname -m)-apple-macosx14.0" -framework AppKit desktop/macos/Icon.swift -o "$RUNNER_TEMP/learningtree-icon"
          "$RUNNER_TEMP/learningtree-icon" "$RUNNER_TEMP/LearningTree.iconset"
          iconutil --convert icns --output "$RUNNER_TEMP/LearningTree.icns" "$RUNNER_TEMP/LearningTree.iconset"
  quality:
    name: Quality and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - name: Verify lightweight dependencies
        run: >-
          uv run python -c "import importlib.util;
          assert all(importlib.util.find_spec(name) is None
          for name in ('torch', 'transformers', 'sentence_transformers'))"
      - run: npm ci --prefix web
      - name: Check publishable source
        run: uv run python scripts/check_release.py
      - name: Lint, tests, types and build
        run: uv run python scripts/manage.py check
      - name: Install test browser
        run: node web/node_modules/playwright/cli.js install chromium --only-shell --with-deps
      - name: Isolated browser smoke test
        run: uv run python scripts/manage.py e2e
