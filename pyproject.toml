[project]
name = "learning-tree"
version = "0.1.0"
description = "LearningTree: a local-first branching workspace for learning with AI"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yuyang16Z" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "openai>=1.40",
    "pydantic-settings>=2.4",
    "mcp>=1.28.1",
    "ddgs==9.16.0",
    "anthropic>=0.84,<1",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.urls]
Repository = "https://github.com/Yuyang16Z/learning-tree"
Issues = "https://github.com/Yuyang16Z/learning-tree/issues"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".runtime", ".venv", "node_modules", "artifacts", "mcp-data", "web"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
"integrations/mcp/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
